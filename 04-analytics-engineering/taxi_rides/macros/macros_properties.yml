version: 2

macros:
  - name: get_payment_type_description
    description: >
      This macro receives a payment_type and returns the corresponding description.
    arguments:
      - name: payment_type
        type: int
        description: > 
          payment_type value.
          Must be one of the accepted values, otherwise the macro will return null

  - name: get_quarter
    description: >
      Get the quarter value based on month
    arguments:
      - name: month
        type: int
        description: > 
          month value

  - name: get_extracted_date
    description: >
      Extract month, year or day from a timestamp
    arguments:
      - name: datetime
        type: timestamp
        description: > 
          a datetime column to process
      - name: time_unit
        type: string
        description: > 
          time unit to extract
          